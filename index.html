<!DOCTYPE html>
<html>
<head>
    <title>Student Webpage</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        nav {
            background: #333;
            padding: 15px;

        }

        nav a {
            color: white;

        table {
            width: 80%;

            border-collapse: collapse;

        th, td {
            border: 1px solid black;

        }

            background: #555;

        }

        form {
            width: 300px;

            background: white;
            padding: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 7px;
            margin: 7px 0;

        }

        button {
            background: #333;

        }
    </style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Students</a>
    <a href="#">Contact</a>
</nav>

<h1>Student Information</h1>

<form id="form">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>

    <select id="course">
        <option value="">Select Course</option>
        <option>AI & DS</option>
        <option>Computer</option>
    </select>

    <button type="submit">Add Record</button>
</form>

<table id="table">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
    </tr>
</table>

<script>
document.getElementById("form").onsubmit = function(e) {

    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let course = document.getElementById("course").value;

    let row = document.getElementById("table").insertRow();

    row.innerHTML =
        "<td>" + name + "</td>" +
        "<td>" + email + "</td>" +
        "<td>" + course + "</td>";

    document.getElementById("form").reset();
};
</script>

</body>
</html>
